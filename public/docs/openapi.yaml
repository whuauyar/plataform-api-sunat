        -
          in: header
          name: X-Api-Key
          description: ''
          example: '{TU_API_KEY}'
          schema:
            type: string
        -
          in: header
          name: X-Api-Secret
          description: ''
          example: '{TU_API_SECRET}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  estado: exito
                  mensaje: 'Si el RUC o email está registrado, recibirás las instrucciones en breve.'
                  datos: null
                properties:
                  estado:
                    type: string
                    example: exito
                  mensaje:
                    type: string
                    example: 'Si el RUC o email está registrado, recibirás las instrucciones en breve.'
                  datos:
                    type: string
                    example: null
                    nullable: true
      tags:
        - Endpoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'This field is required when <code>ruc</code> is not present. Must be a valid email address. Must not be greater than 100 characters.'
                  example: gbailey@example.net
                  nullable: true
                ruc:
                  type: string
                  description: 'This field is required when <code>email</code> is not present. Must be 11 digits.'
                  example: '82256977571'
                  nullable: true
  /api/v1/credenciales/recuperar/verificar:
    post:
      summary: ''
      operationId: postApiV1CredencialesRecuperarVerificar
      description: ''
      parameters:
        -
          in: header
          name: X-Api-Key
          description: ''
          example: '{TU_API_KEY}'
          schema:
            type: string
        -
          in: header
          name: X-Api-Secret
          description: ''
          example: '{TU_API_SECRET}'
          schema:
            type: string
      responses:
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  estado: error
                  mensaje: 'Token inválido o expirado.'
                properties:
                  estado:
                    type: string
                    example: error
                  mensaje:
                    type: string
                    example: 'Token inválido o expirado.'
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: 'Must be 64 characters.'
                  example: bngzmiyvdljnikhwaykcmyuwpwlvqwrsitcpscqldzsnrwtujwvlxjklqppwqbew
              required:
                - token
  /api/v1/sunat/estado:
    get:
