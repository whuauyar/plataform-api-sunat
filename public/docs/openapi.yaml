      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contrato_colaboracion:
                  type: object
                  description: ''
                  example: null
                  properties:
                    numero:
                      type: string
                      description: 'Must not be greater than 50 characters.'
                      example: b
                      nullable: true
                    tipo:
                      type: string
                      description: 'This field is required when <code>contrato_colaboracion.numero</code> is present.'
                      example: 2
                      enum:
                        - 1
                        - 2
                    descripcion:
                      type: string
                      description: 'This field is required when <code>contrato_colaboracion.numero</code> is present. Must not be greater than 250 characters.'
                      example: 'n'
                    porcentaje:
                      type: number
                      description: 'This field is required when <code>contrato_colaboracion.numero</code> is present. Must be at least 0. Must not be greater than 99.99.'
                      example: 7
                  nullable: true
                serie:
                  type: string
                  description: 'Must match the regex /^F[A-Z0-9]{3}$/. Must be 4 characters.'
                  example: zmiy
                correlativo:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 16
                  nullable: true
                cod_local:
                  type: string
                  description: 'Must be 4 characters.'
                  example: dljn
                  nullable: true
                fecha_emision:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-10-03T17:01:44'
                fecha_vencimiento:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-10-03T17:01:44'
                  nullable: true
                tipo_operacion:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
                tipo_moneda:
                  type: string
                  description: ''
                  example: USD
                  enum:
                    - PEN
                    - USD
                    - EUR
                  nullable: true
                forma_pago:
                  type: string
                  description: ''
                  example: Tarjeta
                  enum:
                    - Contado
                    - Credito
                    - Tarjeta
                    - 'Billetera Digital'
                    - Deposito
                    - Transferencia
                  nullable: true
                cliente:
                  type: object
                  description: ''
                  example: []
                  properties:
                    tipo_doc:
                      type: string
                      description: ''
                      example: architecto
                    num_doc:
                      type: string
                      description: 'Must not be greater than 15 characters.'
                      example: 'n'
                    razon_social:
                      type: string
                      description: 'Must not be greater than 1500 characters.'
                      example: g
                    direccion:
                      type: string
                      description: 'Must not be greater than 500 characters.'
                      example: z
                      nullable: true
                    email:
                      type: string
                      description: 'Must be a valid email address.'
                      example: rempel.chadrick@example.org
                      nullable: true
                    telefono:
                      type: string
                      description: 'Must not be greater than 20 characters.'
                      example: ljnikhwaykcmyuwp
                      nullable: true
                  required:
                    - tipo_doc
                    - num_doc
                    - razon_social
                mto_oper_gravadas:
                  type: number
                  description: 'Must be at least 0.'
                  example: 61
                  nullable: true
                mto_oper_exoneradas:
                  type: number
                  description: 'Must be at least 0.'
                  example: 89
                  nullable: true
                mto_oper_inafectas:
                  type: number
                  description: 'Must be at least 0.'
                  example: 34
                  nullable: true
                mto_oper_exportacion:
                  type: number
