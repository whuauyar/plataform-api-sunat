          description: ''
          example: '{TU_API_KEY}'
          schema:
            type: string
        -
          in: header
          name: X-Api-Secret
          description: ''
          example: '{TU_API_SECRET}'
          schema:
            type: string
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  estado: error
                  mensaje: 'Credenciales de API inválidas.'
                properties:
                  estado:
                    type: string
                    example: error
                  mensaje:
                    type: string
                    example: 'Credenciales de API inválidas.'
      tags:
