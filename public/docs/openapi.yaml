openapi: 3.0.3
info:
  title: 'Jorge Chavez API SUNAT — Documentación'
  description: 'API REST para la emisión electrónica ante SUNAT (facturas, boletas, notas de crédito/débito, guías de remisión, resúmenes y comunicaciones de baja).'
  version: 1.0.0
servers:
  -
    url: 'http://api-pro.test'
tags:
  -
    name: Endpoints
    description: ''
components:
  securitySchemes:
    default:
      type: apiKey
      name: X-Api-Key
      in: header
      description: 'Cada petición debe enviar dos cabeceras: <code>X-Api-Key</code> y <code>X-Api-Secret</code>. Ambas se obtienen en el panel de tu empresa (sección Credenciales / Generar credenciales). <b>El secreto solo se muestra al generarlo; guárdalo en un lugar seguro.</b>'
security:
  -
    default: []
paths:
  /api/v1/registro:
    post:
      summary: ''
      operationId: postApiV1Registro
      description: ''
      parameters:
        -
          in: header
          name: X-Api-Key
          description: ''
          example: '{TU_API_KEY}'
          schema:
            type: string
        -
          in: header
          name: X-Api-Secret
          description: ''
          example: '{TU_API_SECRET}'
          schema:
            type: string
      responses:
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  estado: error
                  mensaje: 'Formato de certificado no soportado. Use .pfx, .p12, .pem, .cer o .crt'
                properties:
                  estado:
                    type: string
                    example: error
                  mensaje:
                    type: string
                    example: 'Formato de certificado no soportado. Use .pfx, .p12, .pem, .cer o .crt'
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                ruc:
                  type: string
                  description: 'Must be 11 characters.'
                  example: bngzmiyvdlj
                razon_social:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'n'
                nombre_comercial:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: i
                  nullable: true
                direccion:
                  type: string
                  description: 'Must not be greater than 500 characters.'
                  example: k
                ubigeo:
                  type: string
                  description: 'Must be 6 characters.'
                  example: hwaykc
                departamento:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: m
                  nullable: true
                provincia:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: 'y'
                  nullable: true
                distrito:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: u
                  nullable: true
                sol_user:
                  type: string
                  description: 'Must not be greater than 20 characters.'
                  example: wpwlvqwrsitcpscq
                sol_pass:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: l
                entorno:
                  type: string
                  description: ''
                  example: beta
                  enum:
                    - beta
                    - production
                plan:
                  type: string
                  description: ''
                  example: business
                  enum:
                    - free
                    - pro
                    - business
                tax_regime:
                  type: string
                  description: "Régimen tributario. Por defecto 'general' (18%).\n- general: 18% IGV\n- rer / mype: 18% salvo que se declare igv_rate_override\n- rus: Nuevo RUS (solo boletas, IGV=0, cuota mensual fija)."
                  example: null
                igv_rate_override:
                  type: number
                  description: 'Opcional: forzar una tasa de IGV específica (tiene precedencia sobre el régimen). Must be between 0 and 30.'
                  example: 1
                  nullable: true
                nrus_categoria:
                  type: integer
                  description: 'Solo para NRUS: categoría 1 (cuota S/20) o 2 (cuota S/50). Ignorado para otros regímenes.'
                  example: 2
                  enum:
                    - 1
                    - 2
                  nullable: true
                client_id:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: z
                  nullable: true
                client_secret:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: s
                  nullable: true
                certificado:
                  type: string
                  format: binary
                  description: 'Must be a file. Must not be greater than 100 kilobytes.'
                contrasena_certificado:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: 'n'
                  nullable: true
                logo:
                  type: string
                  format: binary
                  description: 'Must be an image. Must not be greater than 2048 kilobytes.'
                  nullable: true
              required:
                - ruc
                - razon_social
                - direccion
                - ubigeo
                - sol_user
                - sol_pass
                - certificado
